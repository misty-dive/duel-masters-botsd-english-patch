name: Patch bug report
description: Report a translation, graphics, crash, save, or patching problem.
title: "[Bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: Patch version
      placeholder: v1.3
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Emulator / hardware and version
      placeholder: PCSX2 2.x / NetherSX2 / real PS2
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Game location / screen
      description: Story chapter, civilization, shop/deck/card screen, opponent, etc.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: reproducible
    attributes:
      label: Reproducible?
      options: ["Yes", "No", "Unsure"]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots / save-state notes
      description: For hangs, a save state immediately before the problem is especially useful. Do not upload game ISOs or extracted copyrighted assets.
