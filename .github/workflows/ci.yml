name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,graphics]'
      - name: Ruff
        run: ruff check botsd tests
      - name: Mypy
        run: mypy botsd
      - name: Repository data QA
        run: python -m botsd data-audit data
      - name: QA matrix validation
        run: python -m botsd qa-audit qa
      - name: Localization manifest validation
        run: python -m botsd localization-audit localization/en/manifest.json --root .
      - name: Pytest
        run: pytest
